<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First HTML Code</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        }
        .card {
            max-width: 520px;
            width: 100%;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 28px 60px rgba(15, 23, 42, 0.12);
            background: white;
            text-align: center;
        }
        h1 {
            margin: 0 0 1rem;
            font-size: clamp(2rem, 3vw, 3rem);
        }
        p {
            margin: 0 0 1.75rem;
            line-height: 1.75;
            color: #475569;
        }
        button {
            cursor: pointer;
            border: none;
            border-radius: 999px;
            padding: 0.9rem 1.8rem;
            font-size: 1rem;
            font-weight: 600;
            background: #4338ca;
            color: white;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 30px rgba(67, 56, 202, 0.18);
        }
        button:hover,
        button:focus-visible {
            background: #3730a3;
            transform: translateY(-2px);
            outline: 2px solid transparent;
            box-shadow: 0 16px 34px rgba(67, 56, 202, 0.22);
        }
        #message {
            margin-top: 1.25rem;
            font-size: 1rem;
            color: #334155;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Hello World!</h1>
        <p>Welcome to my first HTML project on Goodwall. This page demonstrates a simple page layout, styled content, and an interactive button.</p>
        <button id="actionButton" type="button" aria-live="polite">Click me</button>
        <p id="message">Press the button to see a message.</p>
    </main>

    <script>
        const button = document.getElementById('actionButton');
        const message = document.getElementById('message');

        button.addEventListener('click', () => {
            message.textContent = 'Nice work! You just clicked the button. Keep building more HTML and JavaScript projects.';
        });
    </script>
</body>
</html>
